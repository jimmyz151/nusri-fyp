# SPNv2_BiFPNConvNeXt_v3_261123
#   骨干：ImageNet 预训练 ConvNeXt-T（C2~C5: stride 4/8/16/32）。
#   颈部：ConvNeXt 各级输出先做独立 LayerNorm（仅作用于送往 BiFPN 的分支），
#         再经 1x1 通道投影进入 BiFPN；通道投影与 BiFPN 内部统一使用 GroupNorm。
#         骨干原有 LayerNorm 保留，BiFPN 拓扑不变（C2~C5 -> P2~P7，phi=3，宽度 160）。
#   头部：heatmap + segmentation 双头训练（去掉 efficientpose），损失因子均沿用 1.0。
#         两个头都只取 P2，P3~P7 分支不参与损失，因此 DDP 需要 FIND_UNUSED_PARAM。
#   训练：全帧单阶段，不裁剪、不使用 UDP；测试单次前向，不做二次推理。
#   并行：双卡 DDP，每卡 8，全局 batch = 16。
OUTPUT_DIR: 'checkpoints'
LOG_DIR: 'logs'
SEED: 2021
AUTO_RESUME: True
CUDA: True
FP16: True
VERBOSE: True
EXP_NAME: 'SPNv2_BiFPNConvNeXt_v3_261123'
DIST:
  MULTIPROCESSING_DISTRIBUTED: True
  BACKEND: 'nccl'
  RANK: 0
CUDNN:
  BENCHMARK: True
  DETERMINISTIC: False
  ENABLED: True
DATASET:
  ROOT: '/opt/data/private/SPEED+'
  DATANAME: 'speedplusv2'
  CAMERA: 'camera.json'
  KEYPOINTS: '/opt/data/private/speNet/src/utils/models/tangoPoints.mat'
  CADMODEL: 'models/tango.ply'
  IMAGE_SIZE: [1920, 1200]
  INPUT_SIZE: [768, 512]
  OUTPUT_SIZE: [4, 8, 16, 32]
  MAX_NUM_OBJECTS: 1
  NUM_KEYPOINTS: 11
  NUM_ANCHORS: 9
  SIGMA: 2
AUGMENT:
  P: 0.5
  APPLY_TEXTURE_RANDOMIZATION: False
  ONLINE_TEXTURE: True
  ONLINE_TEXTURE_BEFORE_AUGMENT: True
  RANDOM_TEXTURE:
    ALPHA: 0.5
    PROB: 0.5
  ADJUST_BRIGHTNESS_CONTRAST: True
  APPLY_BLUR: True
  APPLY_SOLAR_FLARE: True
  APPLY_RANDOM_ERASE: True
  APPLY_NOISE: True
TRAIN:
  TRAIN_CSV: 'synthetic/labels/train.csv'
  VAL_CSV: 'synthetic/labels/validation.csv'
  BEGIN_EPOCH: 0
  END_EPOCH: 20
  VALID_FREQ: 1
  VALID_FRACTION: 0.1
  IMAGES_PER_GPU: 8      # 双卡 x 8 = 全局 16
  OPTIMIZER: AdamW
  LR: 1.0e-3
  SCHEDULER: 'step'
  LR_FACTOR: 0.1
  LR_STEP: [15, 18]
  GAMMA1: 0.9
  GAMMA2: 0.999
  WD: 1.0e-4
  WORKERS: 8
TEST:
  TEST_CSV: 'lightbox/labels/lightbox.csv'
  IMAGES_PER_GPU: 1
  HEAD: ['heatmap', 'segmentation']
  BBOX_THRESHOLD: 0.0
  HEATMAP_THRESHOLD: 0.5
  SPEED_THRESHOLD_Q: 0.169
  SPEED_THRESHOLD_T: 2.173e-3
MODEL:
  BACKBONE:
    NAME: 'convnext_bifpn_tiny'
    PRETRAINED: 'checkpoints/pretrained/convnext_tiny-983f1562.pth'
  HEAD:
    NAMES: ['heatmap', 'segmentation']
    LOSS_HEADS: ['heatmap', 'segmentation']
    LOSS_FACTORS: [1.0, 1.0]
    LOSS_NUMS: [1, 1]
  EFFICIENTDET_PHI: 3
  USE_GROUPNORM_BACKBONE: True
  USE_GROUPNORM_HEADS: True
  GROUPNORM_SIZE: 16
  FIND_UNUSED_PARAM: True
