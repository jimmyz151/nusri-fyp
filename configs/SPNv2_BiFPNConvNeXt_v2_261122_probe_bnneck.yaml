# 微调探针 B：从 v2 best 出发，BiFPN 的 GroupNorm 换成 BatchNorm，
# 冻结 ConvNeXt 特征，只训练 neck/heads 2 epoch，检验 GN → BN 对域鲁棒性的影响。
OUTPUT_DIR: 'checkpoints'
LOG_DIR: 'logs'
SEED: 2021
AUTO_RESUME: False
CUDA: True
FP16: True
VERBOSE: True
EXP_NAME: 'SPNv2_BiFPNConvNeXt_v2_261122_probe_bnneck'
DIST:
  MULTIPROCESSING_DISTRIBUTED: True
  BACKEND: 'nccl'
  RANK: 0
CUDNN:
  BENCHMARK: True
  DETERMINISTIC: False
  ENABLED: True
DATASET:
  ROOT: '/opt/data/private/SPEED+'
  DATANAME: 'speedplusv2'
  CAMERA: 'camera.json'
  KEYPOINTS: '/opt/data/private/speNet/src/utils/models/tangoPoints.mat'
  CADMODEL: 'models/tango.ply'
  IMAGE_SIZE: [1920, 1200]
  INPUT_SIZE: [768, 512]
  OUTPUT_SIZE: [4, 8, 16, 32]
  MAX_NUM_OBJECTS: 1
  NUM_KEYPOINTS: 11
  NUM_ANCHORS: 9
  SIGMA: 2
AUGMENT:
  P: 0.5
  APPLY_TEXTURE_RANDOMIZATION: False
  ONLINE_TEXTURE: True
  ONLINE_TEXTURE_BEFORE_AUGMENT: True
  RANDOM_TEXTURE:
    ALPHA: 0.5
    PROB: 0.5
  ADJUST_BRIGHTNESS_CONTRAST: True
  APPLY_BLUR: True
  APPLY_SOLAR_FLARE: True
  APPLY_RANDOM_ERASE: True
  APPLY_NOISE: True
TRAIN:
  TRAIN_CSV: 'synthetic/labels/train.csv'
  VAL_CSV: 'synthetic/labels/validation.csv'
  BEGIN_EPOCH: 0
  END_EPOCH: 1
  VALID_FREQ: 1
  VALID_FRACTION: 0.1
  IMAGES_PER_GPU: 8
  OPTIMIZER: AdamW
  LR: 1.0e-4
  SCHEDULER: 'step'
  LR_FACTOR: 0.1
  LR_STEP: [100]
  GAMMA1: 0.9
  GAMMA2: 0.999
  WD: 1.0e-4
  WORKERS: 8
  FREEZE_BACKBONE: True
TEST:
  TEST_CSV: 'lightbox/labels/lightbox.csv'
  IMAGES_PER_GPU: 1
  HEAD: ['heatmap', 'efficientpose', 'segmentation']
  BBOX_THRESHOLD: 0.0
  HEATMAP_THRESHOLD: 0.5
  SPEED_THRESHOLD_Q: 0.169
  SPEED_THRESHOLD_T: 2.173e-3
MODEL:
  PRETRAIN_FILE: 'checkpoints/SPNv2_BiFPNConvNeXt_v2_261122/model_best.pth.tar'
  PRETRAIN_STRICT: False
  BACKBONE:
    NAME: 'convnext_bifpn_tiny'
    PRETRAINED: 'checkpoints/pretrained/convnext_tiny-983f1562.pth'
    USE_OUTPUT_LN: True
  HEAD:
    NAMES: ['heatmap', 'efficientpose', 'segmentation']
    LOSS_HEADS: ['heatmap', 'efficientpose', 'segmentation']
    LOSS_FACTORS: [1.0, 1.0, 1.0]
    LOSS_NUMS: [1, 3, 1]
    EFFICIENTPOSE_LOSS_FACTOR: [1.0, 1.0, 1.0]
    POSE_REGRESSION_LOSS: 'speed'
    ANCHOR_SCALE: '[2 ** 0, 2 ** (1.0 / 3.0), 2 ** (2.0 / 3.0)]'
    ANCHOR_RATIO: [[1.0, 1.0], [1.4, 0.7], [0.7, 1.4]]
  EFFICIENTDET_PHI: 3
  USE_GROUPNORM_BACKBONE: False
  USE_GROUPNORM_HEADS: True
  GROUPNORM_SIZE: 16
  FIND_UNUSED_PARAM: False
